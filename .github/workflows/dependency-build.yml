name: Validate dependency updates

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  build:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The build only needs non-empty values to initialize the client.
          # Production data and secrets remain in Vercel.
          SUPABASE_URL: https://example.com
          SUPABASE_ANON_KEY: ci-placeholder
